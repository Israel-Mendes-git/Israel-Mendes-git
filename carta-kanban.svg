<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 336" width="240" height="336"
     role="img" aria-label="UI KANBAN — Ferramenta interna. O quadro da equipe numa TV da sala de produção, com burndown.">
  <title>UI KANBAN</title>
  <defs>
    <clipPath id="corte"><rect width="240" height="336" rx="14"/></clipPath>
    <pattern id="hachura" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4a94d8" stroke-width="1" stroke-opacity="0.10"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#4a94d8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4a94d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .emblema { fill: none; stroke: #4a94d8; stroke-width: 2.6; stroke-linejoin: round; }
      .emblema .cheio { fill: #4a94d8; stroke: none; }
      .rotulo { font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace; }
      .texto  { font-family: "Segoe UI", Ubuntu, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#corte)">
    <rect width="240" height="336" fill="#08131f"/>
    <rect width="240" height="336" fill="url(#hachura)"/>
    <rect width="240" height="336" fill="url(#halo)"/>

    <!-- borda dupla + cantoneiras -->
    <rect x="7" y="7" width="226" height="322" rx="11" fill="none"
          stroke="#4a94d8" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="12" y="12" width="216" height="312" rx="8" fill="none"
          stroke="#4a94d8" stroke-opacity="0.22"/>
    <path d="M16,30 L16,16 L30,16" fill="none" stroke="#4a94d8" stroke-width="2" stroke-opacity="0.85"/><path d="M224,30 L224,16 L210,16" fill="none" stroke="#4a94d8" stroke-width="2" stroke-opacity="0.85"/><path d="M16,306 L16,320 L30,320" fill="none" stroke="#4a94d8" stroke-width="2" stroke-opacity="0.85"/><path d="M224,306 L224,320 L210,320" fill="none" stroke="#4a94d8" stroke-width="2" stroke-opacity="0.85"/>

    <!-- ano e selo -->
    <circle cx="36" cy="38" r="14" fill="#08131f" stroke="#4a94d8" stroke-opacity="0.7"/>
    <text x="36" y="42" fill="#4a94d8" font-size="10" font-weight="700"
          text-anchor="middle" class="rotulo">2026</text>
    <text x="216" y="42" fill="#4a94d8" font-size="8" text-anchor="end"
          letter-spacing="2" class="rotulo">NO AR</text>

    <g class="texto"><text x="120.0" y="97" fill="#f0ece4" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1.5">UI KANBAN</text></g>

    <!-- quadro de arte, com o canto cortado -->
    <path d="M22,120 H208 L218,130 V196 H32 L22,186 Z"
          fill="#4a94d8" fill-opacity="0.07" stroke="#4a94d8" stroke-opacity="0.35"/>
    <g class="emblema" transform="translate(120.0, 158.0) scale(0.78)"><rect x="-30" y="-24" width="60" height="48" rx="4"/><path d="M-10,-24 V24 M10,-24 V24"/><rect x="-26" y="-18" width="12" height="9" class="cheio"/><rect x="-6" y="-18" width="12" height="14" class="cheio"/><rect x="14" y="-18" width="12" height="6" class="cheio"/></g>

    <!-- linha de tipo, com regra dupla -->
    <text x="22" y="218" fill="#4a94d8" font-size="11" font-weight="600" class="texto">Ferramenta interna</text>
    <line x1="22" y1="226" x2="218" y2="226" stroke="#4a94d8" stroke-opacity="0.45"/>
    <line x1="22" y1="229" x2="218" y2="229" stroke="#4a94d8" stroke-opacity="0.18"/>

    <g class="texto"><text x="22" y="246" fill="#9d968c" font-size="11">O quadro da equipe numa</text><text x="22" y="263" fill="#9d968c" font-size="11">TV da sala de produção,</text><text x="22" y="280" fill="#9d968c" font-size="11">com burndown.</text></g>

    <line x1="22" y1="296" x2="218" y2="296" stroke="#4a94d8" stroke-opacity="0.35"/>
    <text x="22" y="316" fill="#9d968c" font-size="11" class="rotulo">Kotlin · Compose</text>

    <!-- brilho atravessando, com espera longa entre as passadas -->
    <rect x="-90" y="0" width="70" height="336" fill="url(#brilho)" transform="skewX(-14)">
      <animate attributeName="x" values="-90;-90;280;280"
               keyTimes="0;0.55;0.75;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
