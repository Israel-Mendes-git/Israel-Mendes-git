name: devlog no README

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 9h17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/devlog.py"
      - ".github/workflows/devlog.yml"

# Duas execuções ao mesmo tempo brigariam pelo mesmo commit no README.
concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reescrever o trecho do devlog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/devlog.py

      - name: Publicar se mudou
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "nada mudou"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "devlog: atualiza o que foi mexido por último"
          git push
