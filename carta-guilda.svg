<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 336" width="240" height="336"
     role="img" aria-label="GUILDA DA CORRUPÇÃO — Roguelike de cartas. Heróis morrem para sempre. A guilda vai cair — a questão é quão longe você chega.">
  <title>GUILDA DA CORRUPÇÃO</title>
  <defs>
    <clipPath id="corte"><rect width="240" height="336" rx="14"/></clipPath>
    <pattern id="hachura" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d99a3c" stroke-width="1" stroke-opacity="0.10"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#d99a3c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d99a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .emblema { fill: none; stroke: #d99a3c; stroke-width: 2.6; stroke-linejoin: round; }
      .emblema .cheio { fill: #d99a3c; stroke: none; }
      .rotulo { font-family: ui-monospace, "DejaVu Sans Mono", Consolas, monospace; }
      .texto  { font-family: "Segoe UI", Ubuntu, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#corte)">
    <rect width="240" height="336" fill="#1a1208"/>
    <rect width="240" height="336" fill="url(#hachura)"/>
    <rect width="240" height="336" fill="url(#halo)"/>

    <!-- borda dupla + cantoneiras -->
    <rect x="7" y="7" width="226" height="322" rx="11" fill="none"
          stroke="#d99a3c" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="12" y="12" width="216" height="312" rx="8" fill="none"
          stroke="#d99a3c" stroke-opacity="0.22"/>
    <path d="M16,30 L16,16 L30,16" fill="none" stroke="#d99a3c" stroke-width="2" stroke-opacity="0.85"/><path d="M224,30 L224,16 L210,16" fill="none" stroke="#d99a3c" stroke-width="2" stroke-opacity="0.85"/><path d="M16,306 L16,320 L30,320" fill="none" stroke="#d99a3c" stroke-width="2" stroke-opacity="0.85"/><path d="M224,306 L224,320 L210,320" fill="none" stroke="#d99a3c" stroke-width="2" stroke-opacity="0.85"/>

    <!-- ano e selo -->
    <circle cx="36" cy="38" r="14" fill="#1a1208" stroke="#d99a3c" stroke-opacity="0.7"/>
    <text x="36" y="42" fill="#d99a3c" font-size="10" font-weight="700"
          text-anchor="middle" class="rotulo">2026</text>
    <text x="216" y="42" fill="#d99a3c" font-size="8" text-anchor="end"
          letter-spacing="2" class="rotulo">EM OBRA</text>

    <g class="texto"><text x="120.0" y="85" fill="#f0ece4" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1.5">GUILDA DA</text><text x="120.0" y="108" fill="#f0ece4" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="1.5">CORRUPÇÃO</text></g>

    <!-- quadro de arte, com o canto cortado -->
    <path d="M22,120 H208 L218,130 V196 H32 L22,186 Z"
          fill="#d99a3c" fill-opacity="0.07" stroke="#d99a3c" stroke-opacity="0.35"/>
    <g class="emblema" transform="translate(120.0, 158.0) scale(0.78)"><path d="M0,-32 L26,-21 C26,3 15,24 0,32 C-15,24 -26,3 -26,-21 Z"/><path d="M0,-16 L0,16 M-13,0 L13,0"/></g>

    <!-- linha de tipo, com regra dupla -->
    <text x="22" y="218" fill="#d99a3c" font-size="11" font-weight="600" class="texto">Roguelike de cartas</text>
    <line x1="22" y1="226" x2="218" y2="226" stroke="#d99a3c" stroke-opacity="0.45"/>
    <line x1="22" y1="229" x2="218" y2="229" stroke="#d99a3c" stroke-opacity="0.18"/>

    <g class="texto"><text x="22" y="246" fill="#9d968c" font-size="11">Heróis morrem para sempre.</text><text x="22" y="263" fill="#9d968c" font-size="11">A guilda vai cair — a questão</text><text x="22" y="280" fill="#9d968c" font-size="11">é quão longe você chega.</text></g>

    <line x1="22" y1="296" x2="218" y2="296" stroke="#d99a3c" stroke-opacity="0.35"/>
    <text x="22" y="316" fill="#9d968c" font-size="11" class="rotulo">Unity · C#</text>

    <!-- brilho atravessando, com espera longa entre as passadas -->
    <rect x="-90" y="0" width="70" height="336" fill="url(#brilho)" transform="skewX(-14)">
      <animate attributeName="x" values="-90;-90;280;280"
               keyTimes="0;0.55;0.75;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
